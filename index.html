<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字宿題用プリントメーカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap');
    
    body {
      font-family: 'Klee One', "UD Digi Kyokasho NK-R", "Yu Mincho", serif;
      background-color: #f9fafb;
    }
    
    /* 縦書き用の設定 */
    .vertical-rl {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .horizontal-tb {
      writing-mode: horizontal-tb;
    }
    
    /* --- A4縦向きの厳密な印刷設定 --- */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background-color: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .no-print {
        display: none !important;
      }
      /* 印刷プレビュー領域をA4用紙全体に広げる */
      .print-container {
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important; 
        height: 297mm !important;
        border: none !important;
        padding: 0 !important;
        overflow: hidden !important;
      }
      /* スクロールバーなどを消す */
      #app > div > div:nth-child(2) {
        overflow: visible !important;
      }
    }
    
    /* --- マス目のデザイン (点線の十字リーダー) --- */
    .masu::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dotted #888; /* 点線の横線 */
      pointer-events: none;
    }
    .masu::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 1px dotted #888; /* 点線の縦線 */
      pointer-events: none;
    }
    
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // --- 初期データ定義 (2文字ストックを追加) ---
    const INITIAL_DATA_2 = [
      { id: 1, words: ["神話", "祭る", "薬箱", "お湯"] },
      { id: 2, words: ["使う", "返事", "着る", "問題"] },
      { id: 3, words: ["朝食", "相手", "洋服", "意味"] },
      { id: 4, words: ["主語", "配る", "落下", "発見"] },
      { id: 5, words: ["発音", "船旅", "着地", "新聞"] },
      { id: 6, words: ["自由", "農家", "気配", "有名"] },
      { id: 7, words: ["着く", "漢字", "早朝", "一人"] },
      { id: 8, words: ["明日", "習う", "練る", "実る"] },
      { id: 9, words: ["物語", "発表", "買う", "写真"] },
      { id: 10, words: ["様子", "表す", "場所", "全体"] },
      { id: 11, words: ["落石", "今週", "歩く", "強い"] },
      { id: 12, words: ["工作", "感想", "送る", "一列"] },
      { id: 13, words: ["乗る", "暑い", "寒い", "太陽"] }
    ];

    const INITIAL_DATA_3 = [
      { id: 1, words: ["明るい", "決める", "出来事", "六十秒"] },
      { id: 2, words: ["調べる", "暖かい", "落とす", "内がわ"] },
      { id: 3, words: ["自動車", "新しい", "美しい", ""] },
      { id: 4, words: ["千代紙", "日記帳", "宮大工", "発表会"] }
    ];

    // --- 状態管理 ---
    let state = {
      activeTab: 'print',
      printType: 2,
      printId: 1,
      grade: Number(localStorage.getItem('kanjiGrade')) || 3,
      stock2: JSON.parse(localStorage.getItem('kanjiStock2_v5')) || INITIAL_DATA_2,
      stock3: JSON.parse(localStorage.getItem('kanjiStock3_v5')) || INITIAL_DATA_3
    };

    function saveState() {
      localStorage.setItem('kanjiGrade', state.grade.toString());
      localStorage.setItem('kanjiStock2_v5', JSON.stringify(state.stock2));
      localStorage.setItem('kanjiStock3_v5', JSON.stringify(state.stock3));
    }

    // --- UI レンダリング関数群 ---

    // 1. ナビゲーションタブ
    function renderTabs() {
      return `
        <div class="no-print bg-sky-600 text-white shadow-md z-10 flex-shrink-0">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center px-4">
            <h1 class="text-xl font-bold py-4 pr-8 border-b border-sky-500 sm:border-none w-full sm:w-auto text-center sm:text-left">
              📝 漢字宿題用プリントメーカー
            </h1>
            <div class="flex w-full sm:w-auto overflow-x-auto">
              <button onclick="changeTab('print')" class="px-6 py-4 font-bold whitespace-nowrap transition-colors border-b-4 ${state.activeTab === 'print' ? 'bg-sky-700 border-yellow-400' : 'border-transparent hover:bg-sky-500'}">🖨️ プリント作成</button>
              <button onclick="changeTab('stock2')" class="px-6 py-4 font-bold whitespace-nowrap transition-colors border-b-4 ${state.activeTab === 'stock2' ? 'bg-sky-700 border-emerald-400' : 'border-transparent hover:bg-sky-500'}">📁 2文字ストック</button>
              <button onclick="changeTab('stock3')" class="px-6 py-4 font-bold whitespace-nowrap transition-colors border-b-4 ${state.activeTab === 'stock3' ? 'bg-sky-700 border-emerald-400' : 'border-transparent hover:bg-sky-500'}">📁 3文字ストック</button>
            </div>
          </div>
        </div>
      `;
    }

    // 2. 印刷設定パネル
    function renderSettings() {
      const data = state.printType === 2 ? state.stock2 : state.stock3;
      const options = data.map(item => `
        <option value="${item.id}" ${state.printId === item.id ? 'selected' : ''}>
          番号 ${item.id} （${item.words.filter(w=>w).join(', ') || '未入力'}）
        </option>
      `).join('');

      return `
        <div class="w-full md:w-80 bg-white p-6 border-r border-gray-200 no-print shadow-sm z-10 flex flex-col flex-shrink-0">
          <h2 class="text-lg font-bold mb-6 text-gray-700 border-b pb-2">印刷設定</h2>
          
          <div class="mb-6">
            <label class="block mb-2 font-bold text-gray-600 text-sm">学年</label>
            <select onchange="changeGrade(Number(this.value))" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer">
              <option value="2" ${state.grade === 2 ? 'selected' : ''}>2年生</option>
              <option value="3" ${state.grade === 3 ? 'selected' : ''}>3年生</option>
              <option value="4" ${state.grade === 4 ? 'selected' : ''}>4年生</option>
              <option value="5" ${state.grade === 5 ? 'selected' : ''}>5年生</option>
              <option value="6" ${state.grade === 6 ? 'selected' : ''}>6年生</option>
            </select>
          </div>

          <div class="mb-6">
            <label class="block mb-2 font-bold text-gray-600 text-sm">漢字の種類</label>
            <div class="flex bg-gray-100 p-1 rounded-lg">
              <button onclick="changePrintType(2)" class="flex-1 py-2 rounded-md font-bold transition-all ${state.printType === 2 ? 'bg-white shadow text-sky-600' : 'text-gray-500 hover:bg-gray-200'}">2文字</button>
              <button onclick="changePrintType(3)" class="flex-1 py-2 rounded-md font-bold transition-all ${state.printType === 3 ? 'bg-white shadow text-sky-600' : 'text-gray-500 hover:bg-gray-200'}">3文字</button>
            </div>
          </div>

          <div class="mb-8">
            <label class="block mb-2 font-bold text-gray-600 text-sm">プリント番号を選択</label>
            <select onchange="changePrintId(Number(this.value))" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer">
              ${options}
            </select>
          </div>

          <div class="mt-auto">
            <p class="text-sm text-gray-500 mb-3 leading-relaxed">
              ※ ブラウザの印刷ダイアログが開きます。<br>レイアウト設定で<strong class="text-gray-700 text-lg text-red-500">「縦」</strong>を選択してください。
            </p>
            <button onclick="window.print()" class="w-full bg-sky-500 text-white font-bold py-4 rounded-xl shadow-[0_4px_0_#0284c7] active:shadow-[0_0px_0_#0284c7] active:translate-y-1 transition-all flex justify-center items-center gap-2 text-lg">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
              A4（縦）で印刷
            </button>
            
            <!-- クレジット表記 -->
            <div class="mt-6 text-center text-xs font-semibold text-gray-400">
              ©2026　漢字宿題用プリントメーカー　ＩＣＴ支援の杜
            </div>
          </div>
        </div>
      `;
    }

    // 3. プリント領域
    function renderPrintLayout() {
      const data = state.printType === 2 ? state.stock2 : state.stock3;
      const targetItem = data.find(item => item.id === state.printId) || data[0];
      
      if (!targetItem) return `<div class="flex items-center justify-center h-full text-gray-400">データがありません</div>`;

      const kansuuji = { 2: '二', 3: '三', 4: '四', 5: '五', 6: '六' };
      const gradeStr = kansuuji[state.grade] || '三';

      const words = [...targetItem.words];
      while(words.length < 4) words.push("");

      const totalRows = state.printType === 2 ? 16 : 15;
      const masuSize = 16;   // マス目サイズ 16mm
      const furiSize = 6;    // ふりがな列の幅
      const textSize = 14;   // ★漢字の文字サイズを 12mm から 14mm に拡大
      
      let wordBlocks = '';
      
      // 右から左へ 4つの単語列を配置
      words.forEach((word, index) => {
        const chars = word ? word.split('') : [];
        while(chars.length < state.printType) chars.push('');

        let furiRightRows = '';
        let nazoriRows = '';
        let emptyRows = '';
        
        for(let i = 0; i < totalRows; i++) {
          const char = chars[i % state.printType];
          const isSample = i < state.printType; // 最初のブロックは見本
          const textStyleClass = isSample ? 'text-gray-900 font-bold' : 'text-gray-300 font-normal';
          
          // 右ふりがな列
          furiRightRows += `<div class="w-[${furiSize}mm] h-[${masuSize}mm] border-b border-gray-800 box-border last:border-b-0"></div>`;
          
          // 中央なぞりマス
          nazoriRows += `
            <div class="masu w-[${masuSize}mm] h-[${masuSize}mm] relative flex items-center justify-center horizontal-tb border-b border-gray-800 box-border last:border-b-0">
              <span class="relative z-10 text-[${textSize}mm] ${textStyleClass} leading-none" style="transform: translateY(-0.5mm);">${char}</span>
            </div>
          `;
          
          // 左空マス (自力)
          emptyRows += `
            <div class="masu w-[${masuSize}mm] h-[${masuSize}mm] relative flex items-center justify-center horizontal-tb border-b border-gray-800 box-border last:border-b-0">
            </div>
          `;
        }
        
        const borderLeft = index !== 3 ? 'border-l border-gray-800' : '';
        
        wordBlocks += `
          <div class="flex flex-row-reverse ${borderLeft}">
            <div class="flex flex-col">${furiRightRows}</div>
            <div class="flex flex-col border-r border-gray-800">${nazoriRows}</div>
            <div class="flex flex-col border-r border-gray-800">${emptyRows}</div>
          </div>
        `;
      });

      return `
        <div class="print-container bg-white box-border shadow-xl print:shadow-none mx-auto flex items-center justify-center" style="width: 210mm; height: 297mm;">
          
          <div class="flex flex-row-reverse items-start justify-center" style="height: ${masuSize * totalRows}mm;">
            
            <!-- 右端: タイトル・名前欄 -->
            <div class="w-[25mm] flex flex-col items-center horizontal-tb h-full pr-[3mm] ml-[5mm]">
               <div class="text-[6.5mm] font-bold vertical-rl tracking-[0.3em] mt-[5mm]">${gradeStr}年生の漢字</div>
               
               <div class="flex-1"></div>
               
               <div class="text-[6mm] flex flex-col items-center">
                  <span class="vertical-rl">（</span>
                  <span class="h-[15mm]"></span>
                  <span class="vertical-rl">）</span>
                  <span class="mt-1 vertical-rl">組</span>
               </div>
               
               <div class="h-[15mm]"></div>
               
               <div class="text-[6mm] flex flex-col items-center mb-[5mm]">
                  <span class="vertical-rl tracking-[0.2em]">名前</span>
                  <span class="mt-2 vertical-rl">（</span>
                  <span class="h-[50mm]"></span>
                  <span class="vertical-rl">）</span>
               </div>
            </div>
            
            <!-- メインの表 -->
            <div class="flex flex-row-reverse border-[2px] border-gray-800 box-border">
              ${wordBlocks}
            </div>
            
          </div>
        </div>
      `;
    }

    // 4. ストック編集テーブル
    function renderStockEditor(typeStr) {
      const isType2 = typeStr === 'stock2';
      const data = isType2 ? state.stock2 : state.stock3;
      const typeNum = isType2 ? 2 : 3;
      
      const rows = data.map(item => `
        <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
          <td class="p-3 text-center font-bold text-gray-500">${item.id}</td>
          ${[0, 1, 2, 3].map(i => `
            <td class="p-3">
              <input type="text" 
                     class="border border-gray-300 rounded-lg px-3 py-2 w-full max-w-[140px] focus:outline-none focus:ring-2 focus:ring-emerald-400" 
                     value="${item.words[i] || ''}" 
                     onchange="updateWord(${typeNum}, ${item.id}, ${i}, this.value)">
            </td>
          `).join('')}
          <td class="p-3 text-center">
            <button onclick="deleteWord(${typeNum}, ${item.id})" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1 rounded transition-colors">削除</button>
          </td>
        </tr>
      `).join('');

      return `
        <div class="p-4 md:p-8 w-full max-w-5xl mx-auto no-print">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-6 gap-4">
            <h2 class="text-2xl font-bold text-gray-800 border-b-4 border-emerald-400 pb-2 inline-block">${typeNum}文字の漢字ストック</h2>
            <div class="flex flex-wrap gap-3">
              <button onclick="importCSV(${typeNum})" class="bg-blue-100 text-blue-700 border border-blue-300 px-4 py-2 rounded-full font-bold shadow-sm hover:bg-blue-200 transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                CSV読み込み
              </button>
              <button onclick="addWord(${typeNum})" class="bg-emerald-500 text-white px-5 py-2 rounded-full font-bold shadow hover:bg-emerald-600 transition-colors flex items-center gap-2">
                <span>＋</span> 新しい行を追加
              </button>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow-md overflow-x-auto border border-gray-100">
            <table class="w-full text-left border-collapse min-w-[600px]">
              <thead>
                <tr class="bg-emerald-50 text-emerald-800 border-b-2 border-emerald-100">
                  <th class="p-3 w-16 text-center font-bold">番号</th>
                  <th class="p-3 font-bold">単語 1 (右)</th>
                  <th class="p-3 font-bold">単語 2</th>
                  <th class="p-3 font-bold">単語 3</th>
                  <th class="p-3 font-bold">単語 4 (左)</th>
                  <th class="p-3 w-24 text-center font-bold">操作</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length > 0 ? rows : `<tr><td colSpan="6" class="text-center p-8 text-gray-400">データがありません</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- メインレンダリング処理 ---
    function render() {
      const app = document.getElementById('app');
      
      let content = '';
      if (state.activeTab === 'print') {
        content = `
          <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            ${renderSettings()}
            <!-- スクロール可能なプレビューエリア -->
            <div class="flex-1 bg-gray-400 overflow-auto print:overflow-visible print:bg-white print:p-0 relative">
              <div class="flex justify-center min-w-max min-h-max p-4 md:p-8 print:p-0">
                ${renderPrintLayout()}
              </div>
            </div>
          </div>
        `;
      } else {
        content = `
          <div class="flex-1 overflow-auto bg-gray-50">
            ${renderStockEditor(state.activeTab)}
          </div>
        `;
      }

      app.innerHTML = `
        <div class="h-screen flex flex-col overflow-hidden">
          ${renderTabs()}
          ${content}
        </div>
      `;
    }

    // --- イベントハンドラ群 ---
    window.changeTab = function(tab) {
      state.activeTab = tab;
      render();
    };

    window.changeGrade = function(grade) {
      state.grade = grade;
      saveState();
      render();
    };

    window.changePrintType = function(type) {
      state.printType = type;
      const data = type === 2 ? state.stock2 : state.stock3;
      state.printId = data[0] ? data[0].id : 1;
      render();
    };

    window.changePrintId = function(id) {
      state.printId = id;
      render();
    };

    window.updateWord = function(type, id, index, value) {
      const data = type === 2 ? state.stock2 : state.stock3;
      const item = data.find(d => d.id === id);
      if (item) {
        item.words[index] = value;
        saveState();
      }
    };

    window.addWord = function(type) {
      const data = type === 2 ? state.stock2 : state.stock3;
      const newId = data.length > 0 ? Math.max(...data.map(d => d.id)) + 1 : 1;
      data.push({ id: newId, words: ["", "", "", ""] });
      saveState();
      render();
    };

    window.deleteWord = function(type, id) {
      if (confirm(`番号 ${id} のデータを削除しますか？`)) {
        if (type === 2) {
          state.stock2 = state.stock2.filter(d => d.id !== id);
        } else {
          state.stock3 = state.stock3.filter(d => d.id !== id);
        }
        if (state.printId === id) state.printId = 1;
        saveState();
        render();
      }
    };

    window.importCSV = function(type) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // 文字化け対策: Excelから出力されたCSVはShift_JISが多いため対応
        const readCSV = (encoding) => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsText(file, encoding);
          });
        };

        readCSV('Shift_JIS').then(text => {
          if (text.includes('')) {
            return readCSV('UTF-8');
          }
          return text;
        }).then(text => {
          const lines = text.split(/\r?\n/);
          const newData = [];
          let currentId = 1;
          
          for (let line of lines) {
            if (!line.trim()) continue;
            const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            
            // 行の中から番号（数字）が入っている列を探す
            let numIndex = -1;
            for (let i = 0; i < cols.length; i++) {
              if (cols[i] && !isNaN(parseInt(cols[i])) && parseInt(cols[i]) > 0 && parseInt(cols[i]) < 1000) {
                numIndex = i;
                break;
              }
            }
            
            if (numIndex !== -1 && cols.length >= numIndex + 3) {
              // CSVの列構成に合わせて（左から単語4,3,2,1の順）データを抽出
              let w4 = cols[numIndex+1] || ""; // 単語4(左)
              let w3 = cols[numIndex+2] || ""; // 単語3
              let w2 = cols[numIndex+3] || ""; // 単語2
              let w1 = cols[numIndex+4] || ""; // 単語1(右)
              
              if (w1 || w2 || w3 || w4) {
                newData.push({
                  id: currentId++,
                  words: [w1, w2, w3, w4] // UIの「右から左」にマッピング
                });
              }
            }
          }
          
          if (newData.length > 0) {
            if (confirm(`CSVから ${newData.length} 件のデータを読み込みました。\n\n[OK] 既存のデータをすべて「上書き（置き換え）」する\n[キャンセル] 既存のデータの末尾に「追加」する`)) {
              if (type === 2) state.stock2 = newData;
              else state.stock3 = newData;
            } else {
              const targetStock = type === 2 ? state.stock2 : state.stock3;
              let maxId = targetStock.length > 0 ? Math.max(...targetStock.map(d => d.id)) : 0;
              const appendedData = newData.map(d => ({...d, id: ++maxId}));
              if (type === 2) state.stock2 = [...state.stock2, ...appendedData];
              else state.stock3 = [...state.stock3, ...appendedData];
            }
            saveState();
            render();
            alert('CSVの読み込みが完了しました。');
          } else {
            alert('CSVからデータを読み取れませんでした。\n番号の右隣に単語が並んでいる形式か確認してください。');
          }
        });
      };
      input.click();
    };

    // 初期化
    window.onload = render;
  </script>
</body>
</html>
