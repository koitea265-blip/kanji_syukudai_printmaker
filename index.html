<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字宿題用プリントメーカーV2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap');
    
    body {
      font-family: 'Klee One', "UD Digi Kyokasho NK-R", "Yu Mincho", serif;
      background-color: #f9fafb;
    }
    
    .vertical-rl {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .horizontal-tb {
      writing-mode: horizontal-tb;
    }
    
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background-color: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .no-print {
        display: none !important;
      }
      .print-container {
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important; 
        height: 297mm !important;
        border: none !important;
        padding: 0 !important;
        overflow: hidden !important;
      }
      #app > div > div:nth-child(2) {
        overflow: visible !important;
      }
    }
    
    .print-furi {
      width: 6mm !important;
      min-width: 6mm !important;
      max-width: 6mm !important;
      height: 16mm !important;
      flex-shrink: 0 !important;
    }
    .print-masu {
      width: 16mm !important;
      min-width: 16mm !important;
      max-width: 16mm !important;
      height: 16mm !important;
      flex-shrink: 0 !important;
    }
    .print-text {
      font-size: 14mm !important;
    }
    .print-name-area {
      width: 22mm !important;
      min-width: 22mm !important;
      margin-left: 2mm !important;
    }
    .print-grade-text {
      font-size: 6.5mm !important;
      margin-top: 5mm !important;
    }
    .print-label-text {
      font-size: 6mm !important;
    }
    .print-spacer-15 {
      height: 15mm !important;
      min-height: 15mm !important;
    }
    .print-spacer-50 {
      height: 50mm !important;
      min-height: 50mm !important;
    }
    .print-table-wrapper {
      height: 256mm !important;
      padding-right: 12mm !important;
    }

    .masu::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dotted #888;
      pointer-events: none;
    }
    .masu::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 1px dotted #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // --- 厳密な配当漢字・文字数制限に基づく初期データ定義 ---
    let idCounter2 = 1, idCounter3 = 1, idCounter4 = 1;

    const createData = (grade, wordsList, type) => {
      return wordsList.map(words => {
        let id;
        if (type === 2) id = String(idCounter2++);
        else if (type === 3) id = String(idCounter3++);
        else id = String(idCounter4++);
        return { id, grade, words };
      });
    };

    const INITIAL_DATA_2 = [
      ...createData(2, [["算数", "国語", "図工", "理科"], ["毎日", "読書", "兄弟", "姉妹"], ["春夏", "秋冬", "天気", "晴天"], ["時計", "時間", "午前", "午後"], ["電車", "馬車", "汽車", "歩道"], ["会社", "店長", "売買", "品物"], ["日記", "作文", "絵画", "音楽"], ["前後", "左右", "上下", "東西"], ["南北", "方角", "教室", "校長"], ["元気", "活気", "弱気", "強気"]], 2),
      ...createData(3, [["太陽", "地球", "植物", "動物"], ["暗記", "発表", "相手", "進行"], ["早起", "朝食", "昼食", "夕食"], ["洋服", "和服", "着物", "洋品"], ["発音", "意味", "漢字", "習字"], ["物語", "感想", "日記", "手紙"], ["一列", "全体", "部分", "場所"], ["自由", "平等", "平和", "世界"], ["有名", "名前", "実力", "真実"], ["工作", "図形", "直線", "曲線"]], 2),
      ...createData(4, [["辞書", "辞典", "努力", "成功"], ["健康", "体力", "協力", "希望"], ["発明", "発見", "記録", "観察"], ["変化", "成長", "結果", "不便"], ["自然", "天然", "必然", "当然"], ["季節", "気温", "体温", "水温"], ["楽器", "食器", "音楽", "名曲"], ["歴史", "時代", "文化", "伝記"], ["産業", "農業", "工業", "商業"], ["都市", "地方", "府県", "市区"]], 2),
      ...createData(5, [["準備", "想像", "責任", "豊富"], ["評価", "燃焼", "複雑", "賛成"], ["往復", "経験", "知識", "技術"], ["条件", "証明", "仮説", "検証"], ["構造", "機能", "効果", "影響"], ["政治", "経済", "社会", "国際"], ["資源", "輸入", "輸出", "貿易"], ["権利", "義務", "法律", "規則"], ["個性", "多様", "尊重", "共生"], ["課題", "解決", "目標", "達成"]], 2),
      ...createData(6, [["討論", "貴重", "尊敬", "創造"], ["劇的", "郷土", "勤労", "拡張"], ["厳密", "正確", "論理", "客観"], ["抽象", "具体", "普遍", "特殊"], ["分析", "総合", "比較", "対照"], ["哲学", "思想", "宗教", "倫理"], ["芸術", "文学", "科学", "技術"], ["国家", "国民", "憲法", "主権"], ["平和", "同盟", "条約", "国連"], ["宇宙", "探査", "進化", "起源"]], 2)
    ];

    const INITIAL_DATA_3 = [
      ...createData(2, [["図書室", "理科室", "工作室", "音楽室"], ["一年生", "二年生", "三年生", "四年生"], ["大文字", "小文字", "絵文字", "赤文字"], ["春夏秋", "夏秋冬", "春秋冬", "春夏冬"], ["父母会", "姉妹校", "兄弟分", "親子分"], ["午前中", "毎時間", "毎日中", "毎夜中"], ["東南西", "西北東", "北東南", "南西北"], ["算数科", "国語科", "図工科", "生活科"], ["夕立雲", "雨雲空", "青空市", "夜空星"], ["一日目", "二日目", "三日目", "四日目"]], 3),
      ...createData(3, [["体育館", "図書館", "開会式", "始業式"], ["自動車", "自転車", "乗用車", "発車駅"], ["動物園", "遊園地", "植物園", "公園地"], ["太平洋", "日本海", "大西洋", "地中海"], ["真夜中", "午前中", "午後中", "一日中"], ["進行係", "用具係", "放送係", "図書係"], ["飲食店", "洋服店", "文具店", "日用品"], ["始発駅", "終着駅", "乗車駅", "発車駅"], ["音楽会", "発表会", "見学会", "読書会"], ["急病人", "重病人", "軽病人", "病人食"]], 3),
      ...createData(4, [["新幹線", "特急券", "乗車券", "定期券"], ["商店街", "住宅街", "繁華街", "地下街"], ["市役所", "警察署", "消防署", "保健所"], ["注意報", "警報機", "天気図", "温度計"], ["望遠鏡", "顕微鏡", "双眼鏡", "万華鏡"], ["大自然", "深呼吸", "日光浴", "森林浴"], ["名産品", "特産物", "記念品", "日用品"], ["再放送", "生放送", "録音機", "録画機"], ["飛行場", "駐車場", "駐輪場", "運動場"], ["競技場", "野球場", "体育祭", "文化祭"]], 3),
      ...createData(5, [["解決策", "問題点", "改善案", "具体策"], ["責任感", "正義感", "連帯感", "達成感"], ["地球儀", "世界図", "日本図", "地形図"], ["特産品", "農産物", "水産物", "工業品"], ["輸入額", "輸出額", "貿易港", "工業港"], ["裁判所", "国会議", "内閣府", "省庁名"], ["大統領", "外交官", "大使館", "領事館"], ["環境省", "保護区", "自然林", "人工林"], ["温暖化", "紫外線", "酸性雨", "熱帯雨"], ["過疎化", "過密化", "高齢化", "少子化"]], 3),
      ...createData(6, [["衆議院", "参議院", "最高裁", "裁判長"], ["発展途", "先進国", "新興国", "同盟国"], ["世界遺", "国宝級", "重要財", "無形財"], ["著作権", "肖像権", "所有権", "生存権"], ["義務教", "高等教", "生涯教", "専門職"], ["宇宙船", "探査機", "人工衛", "観測所"], ["情報化", "国際化", "多様化", "個別化"], ["可能性", "必然性", "偶然性", "客観性"], ["主観的", "客観的", "論理的", "感情的"], ["具体例", "抽象論", "一般論", "特殊例"]], 3)
    ];

    const INITIAL_DATA_4 = [
      ...createData(2, [["一石二鳥", "春夏秋冬", "東西南北", "上下左右"], ["一日千秋", "十人十色", "百発百中", "千載一遇"]], 4),
      ...createData(3, [["悪戦苦闘", "以心伝心", "一期一会", "一挙両得"], ["完全無欠", "起死回生", "空前絶後", "言語道断"]], 4),
      ...createData(4, [["自給自足", "試行錯誤", "自業自得", "質実剛健"], ["十中八九", "前代未聞", "絶体絶命", "創意工夫"]], 4),
      ...createData(5, [["単刀直入", "適材適所", "電光石火", "日進月歩"], ["半信半疑", "品行方正", "本末転倒", "無我夢中"]], 4),
      ...createData(6, [["油断大敵", "臨機応変", "老若男女", "和洋折衷"], ["一網打尽", "一目瞭然", "一朝一夕", "一刀両断"]], 4)
    ];

    const STORAGE_KEY_PREFIX = 'kanjiApp_v5_'; // 4文字データ拡充のためv5にアップデート

    // --- ユーティリティ ---
    function normalizeData(data) {
      if (!Array.isArray(data)) return [];
      let maxId = 0;
      data.forEach(item => {
        const idNum = parseInt(item.id, 10);
        if (!isNaN(idNum) && idNum > maxId) maxId = idNum;
      });
      return data.map(item => {
        let idNum = parseInt(item.id, 10);
        if (isNaN(idNum) || item.id == null) {
          maxId++;
          idNum = maxId;
        }
        const words = Array.isArray(item.words) ? item.words : ["", "", "", ""];
        while(words.length < 4) words.push("");
        const grade = item.grade ? Number(item.grade) : 3;
        return { ...item, id: String(idNum), grade, words: words.slice(0, 4) };
      });
    }

    function loadFromStorage(key, defaultData) {
      const saved = localStorage.getItem(STORAGE_KEY_PREFIX + key);
      return saved ? normalizeData(JSON.parse(saved)) : normalizeData(defaultData);
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY_PREFIX + 'grade', state.settings.grade);
      localStorage.setItem(STORAGE_KEY_PREFIX + 'samplePos', state.settings.samplePosition);
      localStorage.setItem(STORAGE_KEY_PREFIX + 'stock2', JSON.stringify(state.stocks[2]));
      localStorage.setItem(STORAGE_KEY_PREFIX + 'stock3', JSON.stringify(state.stocks[3]));
      localStorage.setItem(STORAGE_KEY_PREFIX + 'stock4', JSON.stringify(state.stocks[4]));
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        return {
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[match];
      });
    }

    // --- 状態管理 ---
    let state = {
      activeTab: 'print',
      settings: {
        grade: Number(localStorage.getItem(STORAGE_KEY_PREFIX + 'grade')) || 3,
        printType: 2,
        samplePosition: localStorage.getItem(STORAGE_KEY_PREFIX + 'samplePos') || 'left',
        printId: "1"
      },
      stocks: {
        2: loadFromStorage('stock2', INITIAL_DATA_2),
        3: loadFromStorage('stock3', INITIAL_DATA_3),
        4: loadFromStorage('stock4', INITIAL_DATA_4)
      },
      modal: null
    };

    // --- DOM レンダリング ---
    function renderTabs() {
      const tabs = [
        { id: 'print', label: '🖨️ プリント作成', color: 'border-yellow-400' },
        { id: 'stock2', label: '📁 2文字', color: 'border-emerald-400' },
        { id: 'stock3', label: '📁 3文字', color: 'border-emerald-400' },
        { id: 'stock4', label: '📁 4文字', color: 'border-emerald-400' }
      ];
      
      let tabsHTML = tabs.map(tab => `
        <button type="button" onclick="handleTabChange('${tab.id}')" 
          class="px-6 py-4 font-bold whitespace-nowrap transition-colors border-b-4 ${state.activeTab === tab.id ? `bg-sky-700 ${tab.color}` : 'border-transparent hover:bg-sky-500'}">
          ${tab.label}
        </button>
      `).join('');

      return `
        <div class="no-print bg-sky-600 text-white shadow-md z-10 flex-shrink-0 relative">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center px-4">
            <h1 class="text-xl font-bold py-4 pr-8 border-b border-sky-500 sm:border-none w-full sm:w-auto text-center sm:text-left">
              📝 漢字プリントメーカーV2
            </h1>
            <div class="flex w-full sm:w-auto overflow-x-auto">
              ${tabsHTML}
            </div>
          </div>
        </div>
      `;
    }

    function renderSettingsPanel() {
      const currentStock = state.stocks[state.settings.printType] || [];
      const filteredStock = currentStock.filter(item => item.grade === state.settings.grade);
      
      // 学年変更時に存在しないIDが選ばれている場合は自動補正
      if (filteredStock.length > 0 && !filteredStock.find(item => item.id === state.settings.printId)) {
        state.settings.printId = filteredStock[0].id;
      } else if (filteredStock.length === 0) {
        state.settings.printId = "";
      }

      const gradesHTML = [2, 3, 4, 5, 6].map(g => 
        `<option value="${g}" ${state.settings.grade === g ? 'selected' : ''}>${g}年生</option>`
      ).join('');

      const typesHTML = [2, 3, 4].map(type => `
        <button type="button" onclick="handleSettingChange('printType', ${type})"
          class="flex-1 py-2 rounded-md font-bold transition-all ${state.settings.printType === type ? 'bg-white shadow text-sky-600' : 'text-gray-500 hover:bg-gray-200'}">
          ${type}文字
        </button>
      `).join('');

      const posHTML = [
        { id: 'right', label: '右側 (1列目)' },
        { id: 'left', label: '左側 (2列目)' }
      ].map(pos => `
        <button type="button" onclick="handleSettingChange('samplePosition', '${pos.id}')"
          class="flex-1 py-2 rounded-md font-bold transition-all ${state.settings.samplePosition === pos.id ? 'bg-white shadow text-sky-600' : 'text-gray-500 hover:bg-gray-200'}">
          ${pos.label}
        </button>
      `).join('');

      let optionsHTML = '';
      if (filteredStock.length > 0) {
        optionsHTML = filteredStock.map(item => `
          <option value="${item.id}" ${state.settings.printId === item.id ? 'selected' : ''}>
            番号 ${item.id} （${escapeHTML(item.words.filter(w=>w).join(', ') || '未入力')}）
          </option>
        `).join('');
      } else {
        optionsHTML = `<option value="">この学年のデータはありません</option>`;
      }

      return `
        <div class="w-full md:w-80 bg-white p-6 border-r border-gray-200 no-print shadow-sm z-10 flex flex-col flex-shrink-0 relative">
          <h2 class="text-lg font-bold mb-6 text-gray-700 border-b pb-2">印刷設定</h2>
          
          <div class="mb-6">
            <label class="block mb-2 font-bold text-gray-600 text-sm">学年 (ストックも絞り込まれます)</label>
            <select onchange="handleSettingChange('grade', Number(this.value))" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer">
              ${gradesHTML}
            </select>
          </div>

          <div class="mb-6">
            <label class="block mb-2 font-bold text-gray-600 text-sm">漢字の種類</label>
            <div class="flex bg-gray-100 p-1 rounded-lg">
              ${typesHTML}
            </div>
          </div>

          <div class="mb-6">
            <label class="block mb-2 font-bold text-gray-600 text-sm">お手本の位置</label>
            <div class="flex bg-gray-100 p-1 rounded-lg">
              ${posHTML}
            </div>
          </div>

          <div class="mb-8">
            <label class="block mb-2 font-bold text-gray-600 text-sm">プリント番号を選択</label>
            <select onchange="handleSettingChange('printId', this.value)" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-sky-500 cursor-pointer" ${filteredStock.length === 0 ? 'disabled' : ''}>
              ${optionsHTML}
            </select>
          </div>

          <div class="mt-auto">
            <p class="text-sm text-gray-500 mb-3 leading-relaxed">
              ※ 高品質なPDFデータとして保存したい場合は、印刷ダイアログの送信先（プリンター）から「PDFに保存」を選択してください。
            </p>
            <button onclick="window.print()" ${!state.settings.printId ? 'disabled' : ''}
              class="w-full font-bold py-4 rounded-xl transition-all flex justify-center items-center gap-2 text-lg ${state.settings.printId ? 'bg-sky-500 text-white shadow-[0_4px_0_#0284c7] active:shadow-[0_0px_0_#0284c7] active:translate-y-1' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}">
              A4（縦）で印刷
            </button>
            <div class="mt-6 text-center text-xs font-semibold text-gray-400">
              ©2026　漢字プリントメーカーＶ２　ＩＣＴ支援の杜
            </div>
          </div>
        </div>
      `;
    }

    function renderPrintPreview() {
      const { printType, printId, grade, samplePosition } = state.settings;
      const targetItem = state.stocks[printType].find(item => item.id === String(printId));
      
      if (!targetItem) return `<div class="flex items-center justify-center h-full text-gray-400">データがありません</div>`;

      const kansuujiMap = { 2: '二', 3: '三', 4: '四', 5: '五', 6: '六' };
      const gradeStr = kansuujiMap[grade] || '三';
      const words = [...targetItem.words, "", "", "", ""].slice(0, 4);
      const totalRows = 16;

      let blocksHTML = '';
      words.forEach((word, index) => {
        const actualLen = word ? word.length : 0;
        const wLen = actualLen > 0 ? actualLen : printType;
        
        let colRows = 16;
        if (wLen === 3 || wLen === 5) colRows = 15; 
        else colRows = wLen * Math.floor(16 / wLen); 
        
        if (colRows === 0) colRows = printType * Math.floor(16 / printType); 

        const chars = word ? word.split('') : [];
        while(chars.length < wLen) chars.push('');

        const cells = Array.from({ length: totalRows }).map((_, i) => {
          const isSample = i < colRows && i < wLen && chars[i % wLen] !== '';
          const char = i < colRows ? chars[i % wLen] : '';
          return { char, isSample, isBlank: i >= colRows };
        });

        const renderCol = (isSampleCol) => {
          let colHTML = '';
          cells.forEach((cell) => {
            let inner = '';
            if (!cell.isBlank && isSampleCol) {
              // ブラウザ標準印刷に一本化したため、フォントの重心補正用transformを再導入
              inner = `<span class="relative z-10 print-text leading-none ${cell.isSample ? 'text-gray-900 font-bold' : 'text-gray-300 font-normal'}" style="transform: translateY(-1.5mm);">${escapeHTML(cell.char)}</span>`;
            }
            colHTML += `<div class="masu print-masu relative flex items-center justify-center horizontal-tb border-b border-gray-800 box-border last:border-b-0" style="width: 16mm; height: 16mm">${inner}</div>`;
          });
          return `<div class="flex flex-col">${colHTML}</div>`;
        };

        const col1 = renderCol(samplePosition !== 'left');
        const col2 = renderCol(samplePosition === 'left');

        let furiHTML = '';
        for(let i=0; i<totalRows; i++){
            furiHTML += `<div class="print-furi border-b border-gray-800 box-border last:border-b-0" style="width: 6mm; height: 16mm"></div>`;
        }

        blocksHTML += `
          <div class="flex flex-row-reverse ${index !== 3 ? 'border-l border-gray-800' : ''}">
            <div class="flex flex-col">${furiHTML}</div>
            <div class="border-r border-gray-800">${col1}</div>
            <div class="border-r border-gray-800">${col2}</div>
          </div>
        `;
      });

      return `
        <div class="print-container bg-white box-border shadow-xl print:shadow-none mx-auto flex items-center" style="width: 210mm; height: 297mm;">
          <div class="flex flex-row-reverse items-start w-full print-table-wrapper">
            <div class="flex flex-col items-center horizontal-tb h-full print-name-area">
               <div class="font-bold vertical-rl tracking-[0.3em] print-grade-text">${gradeStr}年生の漢字</div>
               <div class="flex-1"></div>
               <div class="flex flex-col items-center print-label-text">
                  <span class="vertical-rl">（</span>
                  <span class="print-spacer-15"></span>
                  <span class="vertical-rl">）</span>
                  <span class="mt-1 vertical-rl">組</span>
               </div>
               <div class="print-spacer-15"></div>
               <div class="flex flex-col items-center mb-[5mm] print-label-text">
                  <span class="vertical-rl tracking-[0.2em]">名前</span>
                  <span class="mt-2 vertical-rl">（</span>
                  <span class="print-spacer-50"></span>
                  <span class="vertical-rl">）</span>
               </div>
            </div>
            <div class="flex flex-row-reverse border-[2px] border-gray-800 box-border">
              ${blocksHTML}
            </div>
          </div>
        </div>
      `;
    }

    function renderStockEditor(typeNum) {
      const data = state.stocks[typeNum];
      const currentGrade = state.settings.grade;

      let rowsHTML = '';
      if (data.length === 0) {
        rowsHTML = `<tr><td colspan="7" class="text-center p-8 text-gray-400">データがありません</td></tr>`;
      } else {
        rowsHTML = data.map(item => {
          const grades = [2,3,4,5,6].map(g => `<option value="${g}" ${item.grade === g ? 'selected' : ''}>${g}年</option>`).join('');
          
          let wordsHTML = '';
          [0, 1, 2, 3].forEach(i => {
            wordsHTML += `
              <td class="p-3">
                <input type="text" value="${escapeHTML(item.words[i] || '')}" 
                  onchange="handleWordChange(${typeNum}, '${item.id}', ${i}, this.value)"
                  class="border border-gray-300 rounded-lg px-3 py-2 w-full max-w-[140px] focus:outline-none focus:ring-2 focus:ring-emerald-400" />
              </td>
            `;
          });

          return `
            <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
              <td class="p-3 text-center font-bold text-gray-500">${item.id}</td>
              <td class="p-3 text-center">
                <select onchange="handleStockGradeChange(${typeNum}, '${item.id}', this.value)" class="border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                  ${grades}
                </select>
              </td>
              ${wordsHTML}
              <td class="p-3 text-center">
                <button type="button" onclick="triggerDelete(${typeNum}, '${item.id}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1 rounded font-bold">削除</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      return `
        <div class="p-4 md:p-8 w-full max-w-5xl mx-auto no-print">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-6 gap-4">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <h2 class="text-2xl font-bold text-gray-800 border-b-4 border-emerald-400 pb-2 inline-block">${typeNum}文字の漢字ストック</h2>
                <button onclick="showCSVHelp()" class="flex items-center gap-1 text-sm font-bold text-sky-600 bg-sky-50 hover:bg-sky-100 px-3 py-1.5 rounded-full transition-colors border border-sky-200">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  CSVの作り方
                </button>
              </div>
              <p class="text-sm text-gray-500 font-bold">※入力内容はフォーカスが外れたタイミングで自動保存されます</p>
            </div>
            <div class="flex flex-wrap gap-3">
              <button onclick="triggerImportCSV(${typeNum}, ${currentGrade})" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-full font-bold shadow-sm hover:bg-blue-200">CSV読込</button>
              <button onclick="exportCSV(${typeNum})" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-full font-bold shadow-sm hover:bg-indigo-200">CSV保存</button>
              <button onclick="handleAddRow(${typeNum}, ${currentGrade})" class="bg-emerald-500 text-white px-5 py-2 rounded-full font-bold shadow hover:bg-emerald-600">＋ 新しい行を追加</button>
            </div>
          </div>
          
          <div class="bg-white rounded-xl shadow-md overflow-x-auto border border-gray-100 h-[calc(100vh-250px)] relative">
            <table class="w-full text-left border-collapse min-w-[700px] relative">
              <thead class="sticky top-0 z-10">
                <tr class="bg-emerald-50 text-emerald-800 border-b-2 border-emerald-100">
                  <th class="p-3 w-16 text-center font-bold">番号</th>
                  <th class="p-3 w-24 text-center font-bold">学年</th>
                  <th class="p-3 font-bold">単語 1 (右)</th>
                  <th class="p-3 font-bold">単語 2</th>
                  <th class="p-3 font-bold">単語 3</th>
                  <th class="p-3 font-bold">単語 4 (左)</th>
                  <th class="p-3 w-24 text-center font-bold">操作</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHTML}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderModal() {
      if (!state.modal) return '';
      
      let innerHTML = '';
      if (state.modal.type === 'confirm') {
        innerHTML = `
          <h3 class="text-xl font-bold mb-4 text-gray-800">${escapeHTML(state.modal.title)}</h3>
          <p class="mb-8 text-gray-600">${escapeHTML(state.modal.message)}</p>
          <div class="flex justify-end gap-4">
            <button onclick="closeModal()" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300">キャンセル</button>
            <button onclick="executeAction()" class="px-5 py-2 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600">実行する</button>
          </div>
        `;
      } else if (state.modal.type === 'import') {
        innerHTML = `
          <h3 class="text-xl font-bold mb-4 text-gray-800">CSV読み込み確認</h3>
          <p class="mb-6 text-gray-600">${state.modal.newData.length}件のデータをどう処理しますか？</p>
          <div class="flex flex-col gap-3">
            <button onclick="executeImport('overwrite')" class="px-4 py-3 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600 text-left">🔄 既存データを「上書き」する</button>
            <button onclick="executeImport('append')" class="px-4 py-3 bg-emerald-500 text-white rounded-lg font-bold hover:bg-emerald-600 text-left">➕ 既存データの末尾に「追加」する</button>
            <button onclick="closeModal()" class="px-4 py-3 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 text-center mt-2">キャンセル</button>
          </div>
        `;
      } else if (state.modal.type === 'csvHelp') {
        innerHTML = `
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h3 class="text-xl font-bold text-gray-800">CSVファイルの形式</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>
          <div class="text-sm text-gray-600 space-y-4 mb-6 max-h-96 overflow-y-auto pr-2">
            <p>読み込むCSVファイルは、以下の<strong class="text-red-500">6列の構成</strong>である必要があります。</p>
            <div class="bg-gray-100 p-3 rounded border border-gray-200 overflow-x-auto">
              <table class="w-full text-left whitespace-nowrap">
                <thead>
                  <tr class="text-gray-500 border-b border-gray-300">
                    <th class="pr-4 py-1">列A</th><th class="pr-4 py-1">列B</th><th class="pr-4 py-1">列C</th><th class="pr-4 py-1">列D</th><th class="pr-4 py-1">列E</th><th class="py-1">列F</th>
                  </tr>
                </thead>
                <tbody class="font-bold text-gray-700">
                  <tr>
                    <td class="pr-4 py-1">番号</td><td class="pr-4 py-1 text-emerald-600">学年</td><td class="pr-4 py-1">単語4 (左)</td><td class="pr-4 py-1">単語3</td><td class="pr-4 py-1">単語2</td><td class="py-1">単語1 (右)</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <ul class="list-disc pl-5 space-y-1">
              <li>1行目に「番号」という文字が含まれる場合、ヘッダーとして無視されます。</li>
              <li>「学年」の列には、2〜6の半角数字を入力してください（空欄や不正な値の場合は、現在選択中の学年が適用されます）。</li>
              <li>単語の列には、指定した文字数の漢字を入力してください。</li>
            </ul>
            <p class="font-bold text-gray-700 mt-4">記述例（Excel・スプレッドシート等）：</p>
            <div class="bg-gray-800 text-gray-200 p-3 rounded font-mono text-xs overflow-x-auto leading-relaxed">
              番号,学年,単語4(左),単語3,単語2,単語1(右)<br>
              1,2,理科,図工,国語,算数<br>
              2,2,姉妹,兄弟,読書,毎日<br>
              3,3,動物,植物,地球,太陽
            </div>
          </div>
          <div class="flex justify-end">
            <button onclick="closeModal()" class="px-6 py-2 bg-sky-500 text-white rounded-lg font-bold hover:bg-sky-600 transition-colors shadow-sm">閉じる</button>
          </div>
        `;
      }

      return `
        <div class="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4 no-print">
          <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full border border-gray-100">
            ${innerHTML}
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      
      let mainContent = '';
      if (state.activeTab === 'print') {
        mainContent = `
          <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
            ${renderSettingsPanel()}
            <div class="flex-1 bg-gray-400 overflow-auto print:overflow-visible print:bg-white print:p-0 relative">
              <div class="flex justify-center min-w-max min-h-max p-4 md:p-8 print:p-0">
                ${renderPrintPreview()}
              </div>
            </div>
          </div>
        `;
      } else {
        const typeNum = parseInt(state.activeTab.replace('stock', ''), 10);
        mainContent = `
          <div class="flex-1 overflow-auto bg-gray-50 relative w-full">
            ${renderStockEditor(typeNum)}
          </div>
        `;
      }

      app.innerHTML = `
        <div class="h-screen flex flex-col overflow-hidden">
          ${renderTabs()}
          ${mainContent}
          ${renderModal()}
        </div>
      `;
    }

    // --- イベントハンドラ（グローバル） ---
    window.handleTabChange = function(tabId) {
      state.activeTab = tabId;
      render();
    };

    window.handleSettingChange = function(key, value) {
      state.settings[key] = value;
      saveToStorage();
      render();
    };

    window.handleWordChange = function(typeNum, id, wordIndex, value) {
      const data = state.stocks[typeNum];
      state.stocks[typeNum] = data.map(item => {
        if (item.id === id) {
          const newWords = [...item.words];
          newWords[wordIndex] = value;
          return { ...item, words: newWords };
        }
        return item;
      });
      saveToStorage();
      render(); 
    };

    window.handleStockGradeChange = function(typeNum, id, newGrade) {
      const data = state.stocks[typeNum];
      state.stocks[typeNum] = data.map(item => item.id === id ? { ...item, grade: Number(newGrade) } : item);
      saveToStorage();
      render();
    };

    window.handleAddRow = function(typeNum, currentGrade) {
      const data = state.stocks[typeNum];
      const maxId = data.length > 0 ? Math.max(...data.map(d => Number(d.id) || 0)) : 0;
      state.stocks[typeNum] = [...data, { id: String(maxId + 1), grade: currentGrade, words: ["", "", "", ""] }];
      saveToStorage();
      render();
    };

    window.triggerDelete = function(typeNum, id) {
      state.modal = {
        type: 'confirm',
        title: '確認',
        message: 'この行のデータを削除しますか？',
        actionData: { typeNum, id }
      };
      render();
    };

    window.closeModal = function() {
      state.modal = null;
      render();
    };

    window.executeAction = function() {
      if (state.modal && state.modal.actionData) {
        const { typeNum, id } = state.modal.actionData;
        state.stocks[typeNum] = state.stocks[typeNum].filter(item => item.id !== id);
        saveToStorage();
      }
      closeModal();
    };

    window.exportCSV = function(typeNum) {
      const data = state.stocks[typeNum];
      if (data.length === 0) return alert('保存するデータがありません。');
      
      let csvContent = "番号,学年,単語4(左),単語3,単語2,単語1(右)\n";
      data.forEach(item => {
        const row = [
          item.id,
          item.grade,
          ...[3, 2, 1, 0].map(i => `"${(item.words[i] || '').replace(/"/g, '""')}"`)
        ];
        csvContent += row.join(',') + "\n";
      });

      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `漢字ストック_${typeNum}文字_${new Date().toLocaleDateString('ja-JP').replace(/\//g, '')}.csv`;
      link.click();
    };

    window.triggerImportCSV = function(typeNum, currentGrade) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          const lines = text.split(/\r?\n/);
          const newData = [];
          let currentId = 1;

          for (let i = 0; i < lines.length; i++) {
            if (i === 0 && lines[i].includes('番号')) continue; 
            const line = lines[i];
            if (!line.trim()) continue;
            
            const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            
            if (cols.length >= 6) {
              const gradeStr = cols[1];
              let parsedGrade = parseInt(gradeStr, 10);
              if (isNaN(parsedGrade) || parsedGrade < 2 || parsedGrade > 6) {
                  parsedGrade = currentGrade;
              }

              const words = [cols[5] || "", cols[4] || "", cols[3] || "", cols[2] || ""];
              
              if (words.some(w => w)) {
                newData.push({ id: String(currentId++), grade: parsedGrade, words });
              }
            }
          }

          if (newData.length > 0) {
            state.modal = {
              type: 'import',
              typeNum: typeNum,
              newData: newData
            };
            render();
          } else {
            alert('CSVからデータを読み取れませんでした。\n【番号, 学年, 単語4, 単語3, 単語2, 単語1】の形式になっているか確認してください。');
          }
        };
        reader.readAsText(file, 'UTF-8');
      };
      input.click();
    };

    window.executeImport = function(mode) {
      if (!state.modal || state.modal.type !== 'import') return;
      
      const { typeNum, newData } = state.modal;
      const data = state.stocks[typeNum];

      if (mode === 'overwrite') {
        state.stocks[typeNum] = newData;
      } else if (mode === 'append') {
        const maxId = data.length > 0 ? Math.max(...data.map(d => Number(d.id) || 0)) : 0;
        const appended = newData.map((d, i) => ({ ...d, id: String(maxId + i + 1) }));
        state.stocks[typeNum] = [...data, ...appended];
      }
      
      saveToStorage();
      closeModal();
    };

    window.showCSVHelp = function() {
      state.modal = { type: 'csvHelp' };
      render();
    };

    // --- 初期起動 ---
    window.onload = function() {
      // 初期描画
      render();
    };
  </script>
</body>
</html>
